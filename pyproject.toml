[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyevo"
version = "0.1.0"
description = "Pluggable evolutionary search for polymer repeat units and molecules"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "rdkit>=2023.9", "PyYAML>=6", "pyarrow>=14"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
polyevo = "polyevo.cli:main"

[tool.setuptools.packages.find]
include = ["polyevo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
